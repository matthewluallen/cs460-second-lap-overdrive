<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Slipstream pad</title>
<style>
:root{--ink:#e9edf2;--dim:#8d99aa;--line:#232b38;--accent:#59c8ff;--go:#5dff9b;--hot:#ff4d6d;--warn:#ffb84d;--car:#59c8ff;font:16px/1.4 system-ui,-apple-system,sans-serif;color:var(--ink);background:#0b0e13}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}[hidden]{display:none!important}html,body{min-height:100%;height:100%;margin:0;overflow:auto;overscroll-behavior:none;touch-action:pan-y;user-select:none;-webkit-user-select:none}
button:focus-visible,[role=slider]:focus-visible{outline:3px solid var(--accent);outline-offset:3px}button{min-height:44px}#feedback{font-size:.8rem;color:var(--accent);min-height:2.2em}#brake{background:#7a152c;border-color:#ff8fa3}#options{flex-wrap:wrap}#options button{font-size:.75rem;padding:.4rem}button,input{font:inherit;color:var(--ink)}button{border:1px solid var(--line);background:#1c2431;border-radius:.6rem;padding:.6rem 1rem;font-weight:700}
#join{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.5rem;text-align:center}
#join h1{letter-spacing:.14em;margin:0;font-size:1.4rem}#join input{background:#0e131b;border:1px solid var(--line);border-radius:.6rem;padding:.7rem 1rem;width:min(18rem,80vw);text-align:center;user-select:text;-webkit-user-select:text}
#join button{background:var(--accent);color:#06131c;border-color:var(--accent);width:min(18rem,80vw);padding:.9rem}
#msg{color:var(--warn);min-height:1.4em;font-size:.9rem}
#play{min-height:550px;height:100%;display:grid;grid-template-columns:22% 1fr 30%;gap:.6rem;padding:max(.6rem,env(safe-area-inset-top)) max(.6rem,env(safe-area-inset-right)) max(.6rem,env(safe-area-inset-bottom)) max(.6rem,env(safe-area-inset-left))}
#throttle{touch-action:none;position:relative;border:1px solid var(--line);border-radius:1rem;background:linear-gradient(0deg,#10161f,#151d29);overflow:hidden}
#fill{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(0deg,rgba(89,200,255,.25),var(--car))}
#throttle b{position:absolute;left:0;right:0;top:.5rem;text-align:center;font-size:.7rem;letter-spacing:.14em;color:var(--dim)}
#pct{position:absolute;left:0;right:0;bottom:.6rem;text-align:center;font-size:1.5rem;font-weight:800}
#mid{display:flex;flex-direction:column;gap:.5rem;min-width:0}
#car{font-weight:800;font-size:1.15rem;border-left:5px solid var(--car);padding-left:.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mission{background:#13283a;border:1px solid #34516c;border-radius:.65rem;padding:.4rem .6rem;font-size:.8rem}#mission header{display:flex;justify-content:space-between;gap:.5rem}#missionTime{font-variant-numeric:tabular-nums}#missionGoal{color:var(--dim);font-size:.7rem}#status{font-size:.8rem;color:var(--dim)}
.bar{height:12px;border-radius:9px;background:#07090d;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--go)}.bar i.mid{background:var(--warn)}.bar i.low{background:var(--hot)}
#lane{position:relative;height:34px;border:1px solid var(--line);border-radius:99px;background:#0e131b}
#dot{position:absolute;top:3px;left:50%;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:var(--car);box-shadow:0 0 14px var(--car)}
.row{display:flex;flex-wrap:wrap;gap:.5rem}.row button{flex:1}
#cars{display:flex;flex-wrap:wrap;gap:.4rem}#cars button{flex:1 1 40%}
#hint{font-size:.7rem;color:var(--dim)}@media (pointer:coarse){#hint{display:none}}
#score{margin-top:auto;font-size:.8rem;color:var(--dim);display:flex;justify-content:space-between}
#fire{display:grid;grid-template-rows:2fr 1fr 1fr;gap:.5rem}
#fire button{position:relative;font-size:1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.1rem}
#fire small{font-weight:500;color:var(--dim);font-size:.7rem}
#attack{background:radial-gradient(circle at 50% 40%,#ff6b85,#b3243f);border-color:#ff8fa3;font-size:1.3rem!important}
#support{background:radial-gradient(circle at 50% 40%,#3b6ea5,#1d3a5c);border-color:#59c8ff}
#special{background:radial-gradient(circle at 50% 40%,#7a4bb3,#3c2163);border-color:#c77dff}
button.on{filter:brightness(1.5);transform:scale(.97)}button.wait{opacity:.45}button[hidden]{display:none!important}
#down{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,77,109,.28);font-size:2rem;font-weight:900;letter-spacing:.2em;pointer-events:none}
body.down #down{display:flex}
@media (orientation:portrait){#play{height:auto;min-height:100svh;grid-template-columns:1fr;grid-template-rows:120px auto 160px}#fire{grid-template-rows:none;grid-template-columns:2fr 1fr 1fr}}
#fire:has(#special[hidden]){grid-template-rows:2fr 1fr}@media(orientation:portrait){#fire:has(#special[hidden]){grid-template-rows:none;grid-template-columns:1.4fr 1fr}}
button:disabled{opacity:.45;cursor:not-allowed}
@media(orientation:landscape) and (max-height:500px){#play{min-height:390px;height:auto;grid-template-columns:1fr 2fr 1.2fr;gap:.5rem}#mid{gap:.3rem}#hint{display:none}#car{font-size:1rem}#mission{padding:.3rem .5rem}#lane{height:24px;min-height:24px}.row button{font-size:.85rem;padding:.35rem .3rem;min-height:44px}#feedback{font-size:.72rem;min-height:1.8em}#fire button{font-size:1rem!important}}
</style>
</head>
<body>
<section id="join">
  <h1>SLIPSTREAM</h1>
  <label for="name">Driver name</label>
  <input id="name" maxlength="16" placeholder="Your name" autocomplete="off" enterkeyhint="go">
  <button id="go">Join the race</button>
  <div id="msg" role="status"></div>
</section>
<section id="play" hidden>
  <div id="throttle" role="slider" tabindex="0" aria-label="Throttle" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-disabled="true"><b>THROTTLE</b><div id="fill"></div><div id="pct">0</div></div>
  <div id="mid">
    <div id="car">Waiting for a car…</div>
    <div id="mission" hidden><header><strong id="missionTitle"></strong><span id="missionTime" role="timer" aria-live="off"></span></header><div id="missionGoal"></div></div>
    <div class="bar" aria-label="Energy"><i id="energy"></i></div>
    <div id="status">Ask the host to set a car to “Phone”.</div>
    <div id="cars"></div>
    <div id="lane"><div id="dot"></div></div>
    <div class="row"><button id="left" aria-label="Steer left">◀</button><button id="tilt">Tilt steering</button><button id="right" aria-label="Steer right">▶</button></div>
    <div class="row"><button id="flip" hidden>Flip tilt</button><button id="uturn">U-turn</button><button id="brake">BRAKE</button><button id="leave" hidden>Leave car</button></div>
    <div class="row" id="options"><button id="centerTilt" hidden>Center tilt</button><button id="haptics" aria-pressed="false">Haptics: off</button></div>
    <div id="feedback" role="status" aria-live="polite">Eyes on the track. Brake is always within reach.</div>
    <div id="hint">Keyboard: W S speed · A D lane · F fire · G support · R special · Q E switch · X U-turn</div>
    <div id="score"><span id="hits"></span><span id="link"></span></div>
  </div>
  <div id="fire">
    <button id="attack">FIRE<small id="attackName"></small></button>
    <button id="support">SUPPORT<small id="supportName"></small></button>
    <button id="special" hidden>SPECIAL<small id="specialName"></small></button>
  </div>
</section>
<div id="down">DISABLED</div>
<script type="module" src="pad.mjs"></script>
</body>
</html>
