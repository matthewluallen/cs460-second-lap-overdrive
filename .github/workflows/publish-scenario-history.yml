name: Publish fictional scenario history
on:
  push:
    branches: [staff-publication-2026-10-14]
    paths:
      - '.github/workflows/publish-scenario-history.yml'
      - 'history/rowan-pilot.bundle'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'matthewluallen/cs460-second-lap-overdrive'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Import the reviewed fictional history
        shell: bash
        run: |
          set -euo pipefail
          git bundle verify history/rowan-pilot.bundle
          git fetch ./history/rowan-pilot.bundle refs/heads/rowan-pilot-site:refs/heads/rowan-pilot-site
          test "$(git rev-parse rowan-pilot-site)" = 65d282a96d1997ab56d38aa1276bccc114ca7af5
          test "$(git rev-list --count rowan-pilot-site)" = 14
          git log -1 --format=fuller rowan-pilot-site
          git push origin refs/heads/rowan-pilot-site:refs/heads/rowan-pilot-site
